repos:
  - repo: local
    hooks:
      - id: clippy-eye
        name: cargo clippy (eye)
        language: system
        entry: cargo clippy --manifest-path firmware/eye/Cargo.toml -- -D warnings
        files: ^firmware/
        pass_filenames: false

      - id: clippy-eye-previewer
        name: cargo clippy (eye, previewer)
        language: system
        entry: cargo clippy --manifest-path firmware/eye/Cargo.toml --features previewer -- -D warnings
        files: ^firmware/
        pass_filenames: false

      - id: clippy-eye-bringup
        name: cargo clippy (eye, bringup)
        language: system
        entry: cargo clippy --manifest-path firmware/eye/Cargo.toml --features bringup -- -D warnings
        files: ^firmware/
        pass_filenames: false

      - id: clippy-eye-combined-board
        name: cargo clippy (eye, combined-board)
        language: system
        entry: cargo clippy --manifest-path firmware/eye/Cargo.toml --features combined-board -- -D warnings
        files: ^firmware/
        pass_filenames: false

      - id: clippy-ear
        name: cargo clippy (ear)
        language: system
        entry: cargo clippy --manifest-path firmware/ear/Cargo.toml -- -D warnings
        files: ^firmware/
        pass_filenames: false

      - id: clippy-shared
        name: cargo clippy (shared)
        language: system
        entry: cargo clippy --manifest-path firmware/shared/Cargo.toml -- -D warnings
        files: ^firmware/
        pass_filenames: false

      - id: fmt-eye
        name: cargo fmt (eye)
        language: system
        entry: cargo fmt --manifest-path firmware/eye/Cargo.toml --check
        files: ^firmware/
        pass_filenames: false

      - id: fmt-ear
        name: cargo fmt (ear)
        language: system
        entry: cargo fmt --manifest-path firmware/ear/Cargo.toml --check
        files: ^firmware/
        pass_filenames: false

      - id: fmt-shared
        name: cargo fmt (shared)
        language: system
        entry: cargo fmt --manifest-path firmware/shared/Cargo.toml --check
        files: ^firmware/
        pass_filenames: false
