<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Triangel Previewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    canvas { display: block; }
    #status {
      position: fixed; top: 10px; right: 12px;
      font: 11px/1 monospace; padding: 3px 7px; border-radius: 3px;
      background: #222; color: #666;
    }
    #status.live { background: #0a2a0a; color: #4c4; }
    #status.stalled { background: #2a2206; color: #cc4; }

    /* On-screen input panel (previewer builds): mirrors the physical d-pad + switch. */
    #controls {
      position: fixed; left: 12px; bottom: 12px;
      font: 11px/1 monospace; color: #aaa;
      display: flex; gap: 16px; align-items: flex-end;
      user-select: none;
    }
    #controls button {
      font: inherit; color: #ccc; background: #222;
      border: 1px solid #444; border-radius: 3px;
      padding: 6px 0; cursor: pointer;
    }
    #controls button:hover  { background: #333; }
    #controls button:active { background: #0a2a0a; color: #4c4; border-color: #4c4; }
    #controls button.on     { background: #4c4; color: #111; border-color: #4c4; }
    #dpad {
      display: grid; grid-template-columns: repeat(3, 34px); grid-auto-rows: 26px; gap: 3px;
    }
    #dpad .up     { grid-column: 2; grid-row: 1; }
    #dpad .left   { grid-column: 1; grid-row: 2; }
    #dpad .center { grid-column: 2; grid-row: 2; }
    #dpad .right  { grid-column: 3; grid-row: 2; }
    #dpad .down   { grid-column: 2; grid-row: 3; }
    #switch { display: flex; flex-direction: column; gap: 3px; }
    #switch button { width: 48px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status">no bridge</div>

  <div id="controls">
    <div id="dpad">
      <button class="up"     data-cmd="U">Br+</button>
      <button class="left"   data-cmd="L">Prev</button>
      <button class="center" data-cmd="C">Hold</button>
      <button class="right"  data-cmd="R">Next</button>
      <button class="down"   data-cmd="D">Br-</button>
    </div>
    <div id="switch">
      <button data-cmd="S0">Off</button>
      <button data-cmd="S1">Auto</button>
      <button data-cmd="S2">On</button>
    </div>
  </div>

  <script src="led_map.js"></script>
  <script>
  (function () {
    const PADDING = 32;

    // World bounds from LED positions.
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const { wx, wy } of LED_MAP) {
      if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
      if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
    }
    const MARGIN = 8;
    const WORLD_W = maxX - minX + 2 * MARGIN;
    const WORLD_H = maxY - minY + 2 * MARGIN;
    const ORIGIN_X = minX - MARGIN;
    const ORIGIN_Y = minY - MARGIN;

    // Inverse chain map: chainIdx -> LED_MAP index, for decoding bridge frames.
    const byChain = new Array(600);
    LED_MAP.forEach((led, i) => { byChain[led.chainIdx] = i; });

    let liveColors = null;

    // --- WebSocket bridge connection ---------------------------------------
    const statusEl = document.getElementById('status');
    let activeWs = null; // set while connected, for sending on-screen input commands
    let lastFrameMs = 0;

    // Show "no frames" when none has arrived for half a second.
    setInterval(() => {
      if (!activeWs) return;
      const live = performance.now() - lastFrameMs < 500;
      statusEl.textContent = live ? 'bridge live' : 'no frames';
      statusEl.className = live ? 'live' : 'stalled';
    }, 250);

    function connectBridge(wsUrl) {
      const ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        activeWs = ws;
      };

      ws.onmessage = (event) => {
        const bytes = new Uint8Array(event.data);
        if (bytes.length !== 1800) return;
        const frame = new Array(600);
        for (let c = 0; c < 600; c++) {
          frame[byChain[c]] = [bytes[c * 3], bytes[c * 3 + 1], bytes[c * 3 + 2]];
        }
        liveColors = frame;
        lastFrameMs = performance.now();
      };

      ws.onclose = () => {
        activeWs = null;
        liveColors = null;
        statusEl.textContent = 'no bridge';
        statusEl.className = '';
        document.querySelector('#controls button.on')?.classList.remove('on');
        setTimeout(() => connectBridge(wsUrl), 2000); // auto-reconnect
      };

      ws.onerror = () => ws.close();
    }

    connectBridge('ws://localhost:8080');

    // --- On-screen input -> bridge -> firmware (fire-and-forget) -----------
    document.querySelectorAll('#controls button').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (activeWs && activeWs.readyState === WebSocket.OPEN) {
          activeWs.send(btn.dataset.cmd);
          // The page's own count of Hold presses; the eye does not report its state.
          if (btn.dataset.cmd === 'C') btn.classList.toggle('on');
        }
      });
    });

    // --- Canvas -----------------------------------------------------------
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let scale = 1;

    const px = x => PADDING + (x - ORIGIN_X) * scale;
    const py = y => PADDING + (y - ORIGIN_Y) * scale;

    function resize() {
      const availW = window.innerWidth  - PADDING * 2;
      const availH = window.innerHeight - PADDING * 2;
      scale = Math.min(availW / WORLD_W, availH / WORLD_H);
      canvas.width  = Math.round(WORLD_W * scale + PADDING * 2);
      canvas.height = Math.round(WORLD_H * scale + PADDING * 2);
    }

    // LED value to the screen value that gives the same share of light.
    const TO_SCREEN = Array.from({ length: 256 }, (_, v) => Math.round(255 * Math.pow(v / 255, 1 / 2.2)));

    function draw(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const colors = liveColors;
      if (!colors) { requestAnimationFrame(draw); return; }

      const radius = Math.max(2, scale * 3.0);
      for (let i = 0; i < LED_MAP.length; i++) {
        const { wx, wy } = LED_MAP[i];
        const [r, g, b] = colors[i] || [0, 0, 0];
        if (r === 0 && g === 0 && b === 0) continue;
        ctx.fillStyle = `rgb(${TO_SCREEN[r]},${TO_SCREEN[g]},${TO_SCREEN[b]})`;
        ctx.beginPath();
        ctx.arc(px(wx), py(wy), radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Outlines last - always visible on top.
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      for (const pts of BOARD_OUTLINES) {
        ctx.beginPath();
        ctx.moveTo(px(pts[0][0]), py(pts[0][1]));
        ctx.lineTo(px(pts[1][0]), py(pts[1][1]));
        ctx.lineTo(px(pts[2][0]), py(pts[2][1]));
        ctx.closePath();
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
