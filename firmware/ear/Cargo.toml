[package]
name = "ear"
version = "0.1.0"
edition = "2021"

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false }
xous-names = { package = "xous-api-names", version = "0.9.71" }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.70" }
xous = "0.9.70"
log-server = { package = "xous-api-log", version = "0.1.69" }
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
bao1x-hal = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2", features = ["std"] }
bao1x-api = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }
bao1x-hal-service = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }
bao1x-emu = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2", optional = true }
usb-bao1x = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }
bytemuck = "1.24.0"

aes = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2", default-features = false, optional = true }

# hid bringup
xous-usb-hid = { git = "https://github.com/betrusted-io/xous-usb-hid.git", branch = "main", optional = true }

triangel-shared = { path = "../shared" }
rustfft = "6"

[patch.crates-io]
getrandom = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }

# aes testing
[features]
bao1x = ["utralib/bao1x", "usb-bao1x/bao1x", "aes/bao1x"]
board-dabao = [
    "bao1x-hal-service/board-dabao",
    "bao1x-hal/board-dabao",
    "usb-bao1x/board-dabao",
]
usb = []
uart-audio = ["usb"]
# Compute the 24-band mel filterbank on the ear and send framed MelFrames to the eye.
# Off = the temporary broadband RMS level byte. Must match the eye's `mel` feature -
# the two chips share a wire format, so a mismatch garbles the link.
mel = []
# I2S mic drain strategy. Default (neither set) = poll FIFO0 in read_frame.
# `drain-dma` = the BIO writes samples into an IFRAM ring the CPU reads, so the
# mic clock never pauses between frames (needs the i2s_dma BIO program). Only one
# BIO program is used at a time; the two are mutually exclusive.
drain-dma = []
aestests = ["aes"]
default = ["bao1x", "board-dabao"]
