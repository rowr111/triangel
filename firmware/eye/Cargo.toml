[package]
name = "eye"
version = "0.1.0"
edition = "2021"

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.71" }
xous = "0.9.71"
bao1x-hal = { git = "https://github.com/betrusted-io/xous-core", rev = "a9a996d4102afefb9b418bb08c320134e8a5d152", features = ["std"] }
bao1x-api = { git = "https://github.com/betrusted-io/xous-core", rev = "a9a996d4102afefb9b418bb08c320134e8a5d152" }
bao1x-hal-service = { git = "https://github.com/betrusted-io/xous-core", rev = "a9a996d4102afefb9b418bb08c320134e8a5d152" }
usb-bao1x = { git = "https://github.com/betrusted-io/xous-core", rev = "a9a996d4102afefb9b418bb08c320134e8a5d152" }

arbitrary-int = "1.2"
# Stay on 0.2, the version xous-core patches below.
getrandom = "0.2"
triangel-shared = { path = "../shared" }

[patch.crates-io]
getrandom = { git = "https://github.com/betrusted-io/xous-core", rev = "a9a996d4102afefb9b418bb08c320134e8a5d152" }

[features]
bao1x = ["utralib/bao1x", "usb-bao1x/bao1x"]
board-dabao = [
    "bao1x-hal-service/board-dabao",
    "bao1x-hal/board-dabao",
    "usb-bao1x/board-dabao",
]
# Send frames to the browser previewer via USB serial instead of real WS2812 LEDs.
# Use this when developing without triangle boards connected.
previewer = []
# Stream boot progress, IR activity, and panics to the USB serial monitor.
bringup = []
# Panel inputs live on a separate input board reached over I2C (MCP23008 expander plus an
# interrupt line) instead of being wired straight to eye GPIOs on the combined controller board.
input-board = []
default = ["bao1x", "board-dabao"]
