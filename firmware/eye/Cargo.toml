[package]
name = "eye"
version = "0.1.0"
edition = "2021"

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false }
xous-names = { package = "xous-api-names", version = "0.9.71" }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.70" }
xous = "0.9.70"
log-server = { package = "xous-api-log", version = "0.1.69" }
log = "0.4.14"
bao1x-hal = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2", features = ["std"], optional = true }
bao1x-api = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }
bao1x-hal-service = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2", optional = true }
usb-bao1x = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }

bio-lib = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }
arbitrary-int = "1.2"
triangel-shared = { path = "../shared" }

[patch.crates-io]
getrandom = { git = "https://github.com/betrusted-io/xous-core", rev = "aee40a797af372b6debf938d2902b03d1002e8a2" }

[features]
bao1x = ["utralib/bao1x", "usb-bao1x/bao1x"]
board-dabao = [
    "bao1x-hal-service/board-dabao",
    "bao1x-hal/board-dabao",
    "usb-bao1x/board-dabao",
    "bio-lib/ws2812",
]
# Send frames to the browser previewer via USB serial instead of real WS2812 LEDs.
# Use this when developing without triangle boards connected.
previewer = ["usb"]
# Stream boot progress, IR activity, and panics to the USB serial monitor.
bringup = ["usb"]
# Panel inputs live on a separate input board reached over I2C (MCP23008 expander plus an
# interrupt line) instead of being wired straight to eye GPIOs on the combined controller board.
input-board = []
usb = []
default = ["bao1x", "board-dabao"]
